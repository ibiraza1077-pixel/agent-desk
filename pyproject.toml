[project]
name = "agent-desk"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alpaca-py>=0.45.0",
    "anthropic>=2.6.0",
    "fastapi>=0.162.2",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]
research = [
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "torch>=2.15.0",
    "transformers>=5.23.0",
]

[project.scripts]
desk = "desk.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["desk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
